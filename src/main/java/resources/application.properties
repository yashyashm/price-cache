# Number of days a price observation is retained before eviction.
prices.retention-days=30

# Fixed delay (ms) between physical retention cleanup passes.
prices.cleanup-delay-ms=60000
distribution.executor.threads=10

# How long (ms) an SSE price-stream connection stays open before the server closes it.
prices.distribution.stream-timeout-ms=1800000

# Consecutive failed/slow deliveries after which an unresponsive subscriber is auto-evicted.
prices.distribution.max-consecutive-failures=3